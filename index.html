<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AR Дзеркало</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #mirror {
        display: none;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #enterAR {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        padding: 10px 20px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <button id="enterAR">Відкрити AR Дзеркало</button>
    <video id="mirror" autoplay playsinline muted></video>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js";
      import { ARButton } from "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/webxr/ARButton.js";

      let hitTestSource = null;
      let hitTestSourceRequested = false;

      async function supportsWebXR() {
        if (!("xr" in navigator)) return false;
        try {
          // Перевіряємо підтримку immersive-ar
          const supported = await navigator.xr.isSessionSupported("immersive-ar");
          return supported;
        } catch (e) {
          console.log("WebXR not supported:", e);
          return false;
        }
      }

      function isIOS() {
        return /iPhone|iPad|iPod/.test(navigator.userAgent);
      }

      function isAndroid() {
        return /Android/.test(navigator.userAgent);
      }

      // --- WebXR AR з камерою та hit-test ---
      async function startWebXR() {
        // Прибираємо кнопку "Відкрити AR"
        const enterButton = document.getElementById("enterAR");
        if (enterButton) {
          enterButton.style.display = "none";
        }

        const renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true,
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera();

        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        scene.add(light);

        // Дзеркало з більш реалістичним виглядом
        const mirrorWidth = 0.6;
        const mirrorHeight = 1.0;
        const mirrorDepth = 0.02;
        
        // Рама дзеркала
        const frameGeometry = new THREE.BoxGeometry(mirrorWidth + 0.05, mirrorHeight + 0.05, mirrorDepth);
        const frameMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8, roughness: 0.2 });
        const frame = new THREE.Mesh(frameGeometry, frameMaterial);
        
        // Скло дзеркала (сріблястий матеріал)
        const glassGeometry = new THREE.PlaneGeometry(mirrorWidth, mirrorHeight);
        const glassMaterial = new THREE.MeshStandardMaterial({ 
          color: 0xcccccc, 
          metalness: 1.0, 
          roughness: 0.1,
          side: THREE.DoubleSide
        });
        const glass = new THREE.Mesh(glassGeometry, glassMaterial);
        glass.position.z = mirrorDepth / 2 + 0.001;
        
        // Група дзеркала
        const mirror = new THREE.Group();
        mirror.add(frame);
        mirror.add(glass);
        mirror.visible = false;
        scene.add(mirror);

        // Reticle (індикатор наведення на поверхню)
        const reticle = new THREE.Mesh(
          new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
          new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.8 })
        );
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        // ARButton з hit-test
        const arButton = ARButton.createButton(renderer, { 
          requiredFeatures: ["hit-test"],
          optionalFeatures: ["dom-overlay"],
          domOverlay: { root: document.body }
        });
        document.body.appendChild(arButton);

        let mirrorPlaced = false;

        renderer.setAnimationLoop((timestamp, frame) => {
          if (frame) {
            const session = renderer.xr.getSession();
            const referenceSpace = renderer.xr.getReferenceSpace();

            if (!hitTestSourceRequested) {
              session.requestReferenceSpace("viewer").then((refSpace) => {
                session
                  .requestHitTestSource({ space: refSpace })
                  .then((source) => {
                    hitTestSource = source;
                  })
                  .catch((err) => {
                    console.error("Hit test source error:", err);
                  });
              });
              session.addEventListener("end", () => {
                hitTestSourceRequested = false;
                hitTestSource = null;
                mirrorPlaced = false;
                mirror.visible = false;
              });
              hitTestSourceRequested = true;
            }

            if (hitTestSource && !mirrorPlaced) {
              const hitTestResults = frame.getHitTestResults(hitTestSource);
              if (hitTestResults.length > 0) {
                const hit = hitTestResults[0];
                reticle.visible = true;
                reticle.matrix.fromArray(
                  hit.getPose(referenceSpace).transform.matrix
                );
              } else {
                reticle.visible = false;
              }
            } else if (mirrorPlaced) {
              reticle.visible = false;
            }
          }

          renderer.render(scene, camera);
        });

        // Клік по екрану: приклеїти дзеркало до поверхні
        renderer.domElement.addEventListener("click", (event) => {
          if (reticle.visible && !mirrorPlaced) {
            mirror.visible = true;
            mirror.position.setFromMatrixPosition(reticle.matrix);
            mirror.quaternion.setFromRotationMatrix(reticle.matrix);
            mirrorPlaced = true;
            reticle.visible = false;
          }
        });

        // Також підтримка тачів для мобільних
        renderer.domElement.addEventListener("touchend", (event) => {
          event.preventDefault();
          if (reticle.visible && !mirrorPlaced) {
            mirror.visible = true;
            mirror.position.setFromMatrixPosition(reticle.matrix);
            mirror.quaternion.setFromRotationMatrix(reticle.matrix);
            mirrorPlaced = true;
            reticle.visible = false;
          }
        });
      }

      // --- Quick Look для iOS Safari ---
      function openQuickLook() {
        // iOS очікує .usdz файл
        const link = document.createElement("a");
        link.setAttribute("rel", "ar");
        link.setAttribute("href", "mirror.usdz"); // твій .usdz файл
        link.click();
      }

      // --- Scene Viewer для Android ---
      function openSceneViewer() {
        // Android очікує .glb/.gltf файл
        // Використовуємо абсолютний URL для Scene Viewer
        const modelUrl = new URL("mirror.glb", window.location.href).toString();
        
        // Перевіряємо, чи це HTTPS (Scene Viewer потребує HTTPS)
        if (window.location.protocol !== "https:" && window.location.hostname !== "localhost") {
          alert("Для AR на Android потрібен HTTPS або localhost");
          startCameraFallback();
          return;
        }

        const sceneViewerUrl =
          "https://arvr.google.com/scene-viewer/1.0?file=" +
          encodeURIComponent(modelUrl) +
          "&mode=ar-only";

        // Пробуємо відкрити через intent:// для кращої сумісності
        const intentUrl = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(modelUrl)}&mode=ar-only#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=${encodeURIComponent(sceneViewerUrl)};end;`;
        
        try {
          window.location.href = intentUrl;
        } catch (e) {
          // Fallback на звичайний спосіб
          const link = document.createElement("a");
          link.setAttribute("rel", "ar");
          link.setAttribute("href", sceneViewerUrl);
          link.click();
        }
      }

      // --- Fallback: відео задньої камери ---
      async function startCameraFallback() {
        const video = document.getElementById("mirror");
        video.style.display = "block";
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
          });
          video.srcObject = stream;
        } catch (err) {
          alert("Не вдалося відкрити камеру: " + err.message);
        }
      }

      // --- Клік по кнопці ---
      document.getElementById("enterAR").addEventListener("click", async () => {
        try {
          // Для iOS та Android спочатку пробуємо WebXR (якщо доступний)
          if (await supportsWebXR()) {
            startWebXR();
            return;
          }

          // Якщо iOS без WebXR, пробуємо Quick Look
          if (isIOS()) {
            openQuickLook();
            return;
          }

          // Якщо Android без WebXR, пробуємо Scene Viewer
          if (isAndroid()) {
            openSceneViewer();
            return;
          }

          // Фолбек — просто задня камера як "дзеркало"
          startCameraFallback();
        } catch (e) {
          console.error(e);
          // Якщо помилка, пробуємо WebXR або камеру
          if (await supportsWebXR()) {
            startWebXR();
          } else {
            startCameraFallback();
          }
        }
      });
    </script>
  </body>
</html>
