<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AR Дзеркало</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
      #mirror {
        display: none;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #enterAR {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        padding: 15px 30px;
        font-size: 18px;
        background: #007AFF;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
      #info {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 15px 20px;
        border-radius: 10px;
        font-size: 14px;
        text-align: center;
        display: none;
        max-width: 90%;
      }
      #canvas {
        display: none;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <button id="enterAR">Відкрити AR Дзеркало</button>
    <div id="info">Наведіть камеру на стіну. Зелений індикатор покаже, де буде дзеркало. Натисніть на екран, щоб розмістити.</div>
    <video id="mirror" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js";
      import { ARButton } from "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/webxr/ARButton.js";

      function isIOS() {
        return /iPhone|iPad|iPod/.test(navigator.userAgent);
      }

      function isAndroid() {
        return /Android/.test(navigator.userAgent);
      }

      async function supportsWebXR() {
        if (!("xr" in navigator)) return false;
        try {
          return await navigator.xr.isSessionSupported("immersive-ar");
        } catch {
          return false;
        }
      }

      // Простий WebXR з покращеним hit-test
      async function startWebXR() {
        const enterButton = document.getElementById("enterAR");
        const infoDiv = document.getElementById("info");
        
        if (enterButton) enterButton.style.display = "none";
        if (infoDiv) infoDiv.style.display = "block";

        const renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true,
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

        // Освітлення
        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        scene.add(light);

        // Дзеркало
        const mirrorWidth = 0.6;
        const mirrorHeight = 1.0;
        const mirrorDepth = 0.02;
        
        const frameGeometry = new THREE.BoxGeometry(mirrorWidth + 0.05, mirrorHeight + 0.05, mirrorDepth);
        const frameMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8, roughness: 0.2 });
        const frame = new THREE.Mesh(frameGeometry, frameMaterial);
        
        const glassGeometry = new THREE.PlaneGeometry(mirrorWidth, mirrorHeight);
        const glassMaterial = new THREE.MeshStandardMaterial({ 
          color: 0xcccccc, 
          metalness: 1.0, 
          roughness: 0.1,
          side: THREE.DoubleSide
        });
        const glass = new THREE.Mesh(glassGeometry, glassMaterial);
        glass.position.z = mirrorDepth / 2 + 0.001;
        
        const mirror = new THREE.Group();
        mirror.add(frame);
        mirror.add(glass);
        mirror.visible = false;
        scene.add(mirror);

        // Reticle - простий і видимий
        const reticleGeometry = new THREE.RingGeometry(0.1, 0.2, 32);
        reticleGeometry.rotateX(-Math.PI / 2);
        const reticleMaterial = new THREE.MeshBasicMaterial({ 
          color: 0x00ff00, 
          side: THREE.DoubleSide
        });
        const reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        // Центральна точка
        const dotGeometry = new THREE.CircleGeometry(0.02, 16);
        dotGeometry.rotateX(-Math.PI / 2);
        const dot = new THREE.Mesh(dotGeometry, new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
        dot.position.y = 0.001;
        reticle.add(dot);

        // Створюємо AR кнопку
        const arButton = ARButton.createButton(renderer, {
          requiredFeatures: ["hit-test"]
        });
        document.body.appendChild(arButton);

        let hitTestSource = null;
        let hitTestSourceRequested = false;
        let mirrorPlaced = false;

        renderer.setAnimationLoop((timestamp, frame) => {
          if (!frame) return;

          const session = renderer.xr.getSession();
          if (!session) return;

          const referenceSpace = renderer.xr.getReferenceSpace();
          if (!referenceSpace) return;

          // Створюємо hit-test source один раз
          if (!hitTestSourceRequested) {
            session.requestReferenceSpace("viewer").then((viewerSpace) => {
              return session.requestHitTestSource({ space: viewerSpace });
            }).then((source) => {
              hitTestSource = source;
              console.log("Hit test ready");
            }).catch((err) => {
              console.error("Hit test error:", err);
            });
            
            session.addEventListener("end", () => {
              hitTestSourceRequested = false;
              hitTestSource = null;
              mirrorPlaced = false;
              mirror.visible = false;
            });
            
            hitTestSourceRequested = true;
          }

          // Оновлюємо reticle
          if (!mirrorPlaced) {
            if (hitTestSource) {
              try {
                const hitTestResults = frame.getHitTestResults(hitTestSource);
                
                if (hitTestResults.length > 0) {
                  const hit = hitTestResults[0];
                  const pose = hit.getPose(referenceSpace);
                  
                  if (pose) {
                    reticle.visible = true;
                    reticle.matrix.fromArray(pose.transform.matrix);
                  } else {
                    reticle.visible = false;
                  }
                } else {
                  reticle.visible = false;
                }
              } catch (e) {
                console.error("Hit test execution error:", e);
                reticle.visible = false;
              }
            } else {
              // Якщо hit-test не готовий, показуємо reticle в центрі екрану
              if (hitTestSourceRequested) {
                reticle.visible = true;
                // Розміщуємо reticle перед камерою на відстані 1 метр
                reticle.position.set(0, 0, -1);
                reticle.rotation.set(-Math.PI / 2, 0, 0);
                reticle.updateMatrix();
              } else {
                reticle.visible = false;
              }
            }
          } else {
            reticle.visible = false;
          }

          renderer.render(scene, camera);
        });

        // Розміщення дзеркала
        function placeMirror() {
          if (reticle.visible && !mirrorPlaced) {
            mirror.visible = true;
            mirror.position.setFromMatrixPosition(reticle.matrix);
            mirror.quaternion.setFromRotationMatrix(reticle.matrix);
            mirrorPlaced = true;
            reticle.visible = false;
            if (infoDiv) infoDiv.style.display = "none";
          }
        }

        renderer.domElement.addEventListener("click", placeMirror);
        renderer.domElement.addEventListener("touchend", (e) => {
          e.preventDefault();
          placeMirror();
        });
      }

      // Fallback: камера
      async function startCameraFallback() {
        const enterButton = document.getElementById("enterAR");
        const infoDiv = document.getElementById("info");
        const video = document.getElementById("mirror");
        
        if (enterButton) enterButton.style.display = "none";
        if (infoDiv) infoDiv.style.display = "block";
        
        video.style.display = "block";
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" }
          });
          video.srcObject = stream;
        } catch (err) {
          alert("Не вдалося відкрити камеру: " + err.message);
        }
      }

      // Головна функція
      document.getElementById("enterAR").addEventListener("click", async () => {
        try {
          if (await supportsWebXR()) {
            startWebXR();
          } else {
            startCameraFallback();
          }
        } catch (e) {
          console.error(e);
          startCameraFallback();
        }
      });
    </script>
  </body>
</html>
