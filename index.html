<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AR Дзеркало</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }

      #enterAR {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        padding: 12px 18px;
        font-size: 16px;
      }

      #hud {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.35;
        display: none;
        white-space: pre-line;
      }

      #mirrorVideo {
        display: none;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <button id="enterAR">Відкрити AR Дзеркало</button>
    <div id="hud"></div>
    <!-- iOS Quick Look: краще мати реальний <a rel="ar"> в DOM -->
    <a id="quicklookLink" rel="ar" href="mirror.usdz" style="display:none">AR</a>
    <video id="mirrorVideo" autoplay playsinline muted></video>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js";
      import { ARButton } from "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/webxr/ARButton.js";
      import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/loaders/GLTFLoader.js";

      const $enter = document.getElementById("enterAR");
      const $hud = document.getElementById("hud");
      const $video = document.getElementById("mirrorVideo");
      const $quickLook = document.getElementById("quicklookLink");

      function setHud(text, show = true) {
        $hud.textContent = text;
        $hud.style.display = show ? "block" : "none";
      }

      function isIOS() {
        return /iPhone|iPad|iPod/i.test(navigator.userAgent);
      }

      function isAndroid() {
        return /Android/i.test(navigator.userAgent);
      }

      async function supportsWebXRImmersiveAR() {
        if (!("xr" in navigator)) return false;
        try {
          return await navigator.xr.isSessionSupported("immersive-ar");
        } catch {
          return false;
        }
      }

      // iOS Quick Look (USDZ). У Safari це єдиний стабільний WebAR без сторонніх SDK.
      function openQuickLook() {
        // ВАЖЛИВО: має викликатися синхронно з user gesture (без await перед цим),
        // і Safari краще працює з реальною <a rel="ar"> в DOM.
        $quickLook.click();
      }

      async function startCameraFallback() {
        $enter.style.display = "none";
        $video.style.display = "block";
        setHud("Фолбек: просто камера (без прилипання до стіни).", true);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
            audio: false,
          });
          $video.srcObject = stream;
        } catch (err) {
          alert("Не вдалося відкрити камеру: " + err.message);
        }
      }

      // Android/WebXR: “прилипання” = модель завжди стоїть на hit-test точці в центрі екрана
      // (тобто куди навів — туди й “прилипло”). Тапом можна зафіксувати/відпустити.
      async function startWebXRStickyMirror() {
        $enter.style.display = "none";
        setHud(
          "WebXR режим.\n- Наведіть центр екрана на стіну.\n- Дзеркало має ‘липнути’ до поверхні.\n- Тап: зафіксувати/відпустити.",
          true
        );

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        renderer.xr.setReferenceSpaceType("local");
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera();
        scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

        // Дзеркало: пробуємо завантажити `mirror.glb`.
        // Якщо файлу нема/помилка — показуємо простий фолбек-обʼєкт.
        const mirror = new THREE.Group();
        mirror.visible = false;
        scene.add(mirror);

        function buildFallbackMirror() {
          mirror.clear();
          const mirrorWidth = 0.6;
          const mirrorHeight = 1.0;
          const mirrorDepth = 0.02;

          const frame = new THREE.Mesh(
            new THREE.BoxGeometry(mirrorWidth + 0.05, mirrorHeight + 0.05, mirrorDepth),
            new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.6, roughness: 0.25 })
          );

          const glass = new THREE.Mesh(
            new THREE.PlaneGeometry(mirrorWidth, mirrorHeight),
            new THREE.MeshStandardMaterial({
              color: 0xcccccc,
              metalness: 1.0,
              roughness: 0.08,
              side: THREE.DoubleSide,
            })
          );
          glass.position.z = mirrorDepth / 2 + 0.001;
          mirror.add(frame);
          mirror.add(glass);
        }

        function normalizeForWallPlacement(root) {
          // Масштабуємо до ~1м висоти, центруємо, і зсуваємо так,
          // щоб “задня” сторона була біля z=0 (щоб при placement не “висіло” в повітрі).
          const box = new THREE.Box3().setFromObject(root);
          const size = new THREE.Vector3();
          box.getSize(size);
          if (!size.y || size.y < 1e-6) return;

          const targetHeightM = 1.0;
          const s = targetHeightM / size.y;
          root.scale.setScalar(s);
          root.updateMatrixWorld(true);

          box.setFromObject(root);
          const center = new THREE.Vector3();
          box.getCenter(center);
          root.position.sub(center);
          root.updateMatrixWorld(true);

          box.setFromObject(root);
          // Зсуваємо по Z так, щоб найзадніша точка була в нулі
          root.position.z -= box.min.z;
          root.updateMatrixWorld(true);
        }

        // Підвантажуємо glb (якщо ти його додаси в корінь проєкту)
        const gltfLoader = new GLTFLoader();
        gltfLoader.load(
          "mirror.glb",
          (gltf) => {
            mirror.clear();
            const model = gltf.scene || gltf.scenes?.[0];
            if (model) {
              normalizeForWallPlacement(model);
              mirror.add(model);
              setHud(
                "WebXR режим.\n- Наведіть центр екрана на стіну.\n- Дзеркало ‘липне’ до поверхні.\n- Тап: зафіксувати/відпустити.\n\n(Модель: mirror.glb завантажена)",
                true
              );
            } else {
              buildFallbackMirror();
            }
          },
          undefined,
          (err) => {
            buildFallbackMirror();
            setHud(
              "WebXR режим.\n- Наведіть центр екрана на стіну.\n- Дзеркало ‘липне’ до поверхні.\n- Тап: зафіксувати/відпустити.\n\nНе вдалося завантажити mirror.glb — використовую фолбек-дзеркало.\n" +
                String(err?.message || err),
              true
            );
          }
        );

        // Reticle (debug + aiming)
        const reticle = new THREE.Mesh(
          new THREE.RingGeometry(0.08, 0.12, 32).rotateX(-Math.PI / 2),
          new THREE.MeshBasicMaterial({ color: 0x00ff00, side: THREE.DoubleSide })
        );
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        let hitTestSource = null;
        let hitTestSourceRequested = false;
        let locked = false;

        const tmpCamPos = new THREE.Vector3();
        const tmpToCam = new THREE.Vector3();
        const tmpNormal = new THREE.Vector3();

        function toggleLock() {
          locked = !locked;
          setHud(
            locked
              ? "Зафіксовано. Тап — щоб відпустити та знову ‘липнути’."
              : "Не зафіксовано. Наведіть на стіну — дзеркало ‘липне’. Тап — зафіксувати.",
            true
          );
        }

        renderer.domElement.addEventListener("click", toggleLock, { passive: true });
        renderer.domElement.addEventListener(
          "touchend",
          (e) => {
            e.preventDefault();
            toggleLock();
          },
          { passive: false }
        );

        const arButton = ARButton.createButton(renderer, { requiredFeatures: ["hit-test"] });
        document.body.appendChild(arButton);

        renderer.setAnimationLoop((t, frame) => {
          if (!frame) return;

          const session = renderer.xr.getSession();
          const referenceSpace = renderer.xr.getReferenceSpace();
          if (!session || !referenceSpace) return;

          if (!hitTestSourceRequested) {
            hitTestSourceRequested = true;
            session
              .requestReferenceSpace("viewer")
              .then((viewerSpace) => session.requestHitTestSource({ space: viewerSpace }))
              .then((source) => {
                hitTestSource = source;
              })
              .catch((err) => {
                hitTestSource = null;
                setHud(
                  "WebXR запустився, але hit-test недоступний.\n" +
                    "Перевір: Chrome + встановлений Google Play Services for AR.\n\n" +
                    String(err?.message || err),
                  true
                );
              });

            session.addEventListener("end", () => {
              hitTestSourceRequested = false;
              hitTestSource = null;
              locked = false;
              mirror.visible = false;
              reticle.visible = false;
            });
          }

          if (hitTestSource && !locked) {
            const hits = frame.getHitTestResults(hitTestSource);
            if (hits.length) {
              const pose = hits[0].getPose(referenceSpace);
              if (pose) {
                reticle.visible = true;
                mirror.visible = true;

                reticle.matrix.fromArray(pose.transform.matrix);

                mirror.matrix.fromArray(pose.transform.matrix);
                mirror.matrix.decompose(mirror.position, mirror.quaternion, mirror.scale);

                // Flip mirror to face camera if it ends up backwards
                tmpCamPos.setFromMatrixPosition(camera.matrixWorld);
                tmpToCam.copy(tmpCamPos).sub(mirror.position).normalize();
                tmpNormal.set(0, 0, 1).applyQuaternion(mirror.quaternion);
                if (tmpNormal.dot(tmpToCam) < 0) mirror.rotateY(Math.PI);
              } else {
                reticle.visible = false;
                mirror.visible = false;
              }
            } else {
              reticle.visible = false;
              mirror.visible = false;
            }
          } else if (locked) {
            reticle.visible = false;
          }

          renderer.render(scene, camera);
        });
      }

      $enter.addEventListener("click", async () => {
        // iOS: відкриваємо Quick Look СИНХРОННО (без await до цього),
        // інакше Safari може заблокувати відкриття.
        if (isIOS()) {
          setHud(
            "iOS Safari: відкриваю Quick Look.\n\n" +
              "Як поставити дзеркало НА СТІНУ у Quick Look:\n" +
              "- спочатку ‘проскануйте’ кімнату (водіть телефоном)\n" +
              "- тапніть по стіні (краще текстурованій, при хорошому світлі)\n" +
              "- якщо поставило в центрі — спробуйте ще раз, ближче до стіни\n\n" +
              "Важливо: Quick Look не дає вебу керувати ‘приклеюванням’ до стіни — це обмеження iOS Safari.",
            true
          );
          openQuickLook();
          return;
        }

        const webxr = await supportsWebXRImmersiveAR();

        if (webxr) {
          await startWebXRStickyMirror();
          return;
        }

        if (isAndroid()) {
          setHud(
            "Android: WebXR AR недоступний у цьому браузері.\n" +
              "Спробуйте Chrome + встановлений Google Play Services for AR.\n" +
              "Вмикаю фолбек-камеру.",
            true
          );
          await startCameraFallback();
          return;
        }

        await startCameraFallback();
      });
    </script>
  </body>
</html>
